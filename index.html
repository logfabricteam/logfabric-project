<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LogFabric</title>
<style>
  :root { --bg: #fafaf8; --fg: #222; --sub: #777; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --sub: #999; } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px;
  }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 1rem; letter-spacing: .02em; }
  p { margin: .3rem 0; line-height: 1.7; }
  .sub { color: var(--sub); font-size: .95rem; }
</style>
</head>
<body>
  <main>
    <h1>LogFabric</h1>
    <p>We're building something new. Please check back soon.</p>
    <p class="sub">ただいま準備中です。</p>
  </main>
</body>
</html>
